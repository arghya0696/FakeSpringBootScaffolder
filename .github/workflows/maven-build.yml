name: Spring Boot Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Set up the Java environment (Adjust java-version if you are not using Java 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Stage 1: Print starting
    - name: Stage 1 - Print starting
      run: echo "Starting..."

    # Stage 2: mvn clean install
    - name: Stage 2 - Run Maven Clean Install
      run: mvn clean install

    # Stage 3: done with test fail or pass result
    # The 'if: always()' ensures this step runs even if the previous Maven command fails due to a failing test.
#    - name: Stage 3 - Print Result
#      if: always()
#      run: echo Done with test. Result: ${{ job.status }}